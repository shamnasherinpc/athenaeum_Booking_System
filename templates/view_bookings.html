<!DOCTYPE html>
<html>

<head>

<title>View Bookings</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{

background:linear-gradient(
135deg,
#0f172a,
#0c4a6e,
#0284c7
);

color:white;
}

.page-content{

margin-left:300px;
padding:40px;
}

table{

width:100%;
border-collapse:collapse;

background:white;
color:black;

border-radius:20px;
overflow:hidden;

box-shadow:0 8px 20px rgba(0,0,0,.3);

margin-top:30px;
}

th{

background:#2563eb;
color:white;
padding:18px;
}

td{

padding:15px;
text-align:center;
}

tr:nth-child(even){

background:#f5f5f5;
}

.approve{

background:#22c55e;
color:white;

padding:10px 15px;

border-radius:8px;
text-decoration:none;
}

.reject{

background:#ef4444;
color:white;

padding:10px 15px;

border-radius:8px;
text-decoration:none;
margin-left:5px;
}

h1{

font-size:40px;
margin-bottom:20px;
}

</style>

</head>

<body>

{% include "admin_sidebar.html" %}

<div class="page-content">

<h1>Bookings</h1>

<table>

<tr>

<th>ID</th>
<th>Department</th>
<th>Event</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>

</tr>

{% for row in bookings %}

<tr>

<td>{{row[0]}}</td>
<td>{{row[1]}}</td>
<td>{{row[2]}}</td>
<td>{{row[3]}}</td>
<td>{{row[7]}}</td>

<td>

<a href="/approve/{{row[0]}}" class="approve">
Approve
</a>

<a href="/reject/{{row[0]}}" class="reject">
Reject
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>

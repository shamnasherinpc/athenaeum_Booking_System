<!DOCTYPE html>
<html>

<head>

<title>Book Auditorium</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(
135deg,
#0f172a,
#0f172a,
#0ea5e9
);

height:100vh;
display:flex;
overflow:hidden;
color:white;
}

/* SIDEBAR */

.sidebar{

width:270px;
height:100vh;

background:rgba(
20,
30,
80,
0.8
);

padding:30px;

position:fixed;
left:0;
top:0;

display:flex;
flex-direction:column;
}

.sidebar h1{

font-size:38px;
margin-bottom:40px;
}

.sidebar a{

text-decoration:none;
color:white;

padding:16px;
margin-bottom:20px;

border-radius:14px;

background:linear-gradient(
90deg,
#1d4ed8,
#0ea5e9
);

font-size:20px;
font-weight:bold;
text-align:center;
}

.logout{

margin-top:auto;

background:linear-gradient(
90deg,
#ef4444,
#dc2626
)!important;
}


/* MAIN */

.main{

margin-left:300px;
padding:50px;
width:100%;
overflow:auto;
}

.main h1{

font-size:65px;
margin-bottom:25px;
}


/* MESSAGES */

.error{

background:#dc2626;
padding:15px;

border-radius:10px;

margin-bottom:20px;
font-size:18px;
}

.success{

background:#16a34a;
padding:15px;

border-radius:10px;

margin-bottom:20px;
font-size:18px;
}


/* CARD */

.card{

background:white;
padding:40px;

border-radius:25px;

color:black;
}


/* FORM */

.form-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:30px;
}

label{

display:block;

margin-bottom:10px;

font-size:20px;
font-weight:bold;
}

input,
select{

width:100%;
padding:16px;

border:1px solid #ddd;

border-radius:10px;

font-size:17px;
}

button{

margin-top:40px;
width:100%;

padding:18px;

border:none;

border-radius:12px;

background:linear-gradient(
90deg,
#2563eb,
#0ea5e9
);

font-size:22px;
font-weight:bold;
color:white;

cursor:pointer;
}

button:hover{

opacity:.9;
}

</style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

<h1>
Athenaeum
</h1>

<a href="/booking">

Book Auditorium

</a>

<a href="/my_bookings">

My Bookings

</a>


<a href="/" class="logout">

Logout

</a>

</div>



<!-- MAIN -->

<div class="main">

<h1>

Book Auditorium

</h1>


{% if error %}

<div class="error">

{{error}}

</div>

{% endif %}


{% if success %}

<div class="success">

{{success}}

</div>

{% endif %}


<div class="card">

<form
action="/save_booking"
method="POST">

<div class="form-grid">


<!-- Department -->

<div>

<label>

Department

</label>

<select
name="department"
required>

<option value="">
Select Department
</option>

<option>BBA</option>

<option>BCA</option>

<option>B Pharm</option>

<option>Engineering</option>

</select>

</div>



<!-- Event -->

<div>

<label>

Event Name

</label>

<input
type="text"
name="event"
placeholder="Enter Event Name"
required>

</div>



<!-- Date -->

<div>

<label>

Date

</label>

<input
type="date"
id="bookingDate"
name="date"
required>

</div>



<!-- Participants -->

<div>

<label>

Expected Participants

</label>

<input
type="number"
name="participants"
placeholder="Enter Number"
required>

</div>



<!-- Start Time -->

<div>

<label>

Start Time

</label>

<select
name="start"
required>

<option value="">
Select Time
</option>

<option>09:00 AM</option>
<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>01:00 PM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>

</select>

</div>



<!-- End Time -->

<div>

<label>

End Time

</label>

<select
name="end"
required>

<option value="">
Select Time
</option>

<option>10:00 AM</option>
<option>11:00 AM</option>
<option>12:00 PM</option>
<option>01:00 PM</option>
<option>02:00 PM</option>
<option>03:00 PM</option>
<option>04:00 PM</option>

</select>

</div>


</div>


<button>

Book Auditorium

</button>


</form>

</div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function(){

    let dateField = document.querySelector('input[name="date"]');

    // Tomorrow date
    let tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate()+1);

    let year = tomorrow.getFullYear();
    let month = String(tomorrow.getMonth()+1).padStart(2,'0');
    let day = String(tomorrow.getDate()).padStart(2,'0');

    // Block today + previous dates
    dateField.min = `${year}-${month}-${day}`;

    // Block Saturday & Sunday
    dateField.addEventListener("input", function(){

        let selected = new Date(this.value);

        let dayNumber = selected.getDay();

        // Sunday=0 Saturday=6
        if(dayNumber==0 || dayNumber==6){

            alert("Booking is closed on Saturday and Sunday");

            this.value="";
        }

    });

});

</script>

</body>
</html>
